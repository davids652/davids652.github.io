<html>

<head>
    <title>Escaperoom</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: rgb(252, 91, 91);
            color: white;
        }

        .title {
            font-size: 80;
            font-weight: bold;
        }

        input {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>
    <center>
        <span class="title">Escaperoom</span>
        <br>
        <span class="status" id="status">Niet gekraakt</span>

        <form onchange="checkSolution();">
            Letters sleutel 1: <input id="form1" type="text" class="answerForm" maxlength="5" placeholder="_____" />
            <br>
            Letter sleutel 2: <input id="form2" type="text" class="answerForm" maxlength="1" placeholder="_" />
            <br>
            Woord sleutel 3: <input id="form3" type="text" class="answerForm" maxlength="8" placeholder="________" />
            <br>
            Letters sleutel 4: <input id="form4" type="text" class="answerForm" maxlength="5" placeholder="_____" />
            <br>
            Subnetmasker sleutel 5: <input id="form5" type="text" class="answerForm" maxlength="15" placeholder="___.___.___.___" />
            <br>    
            Woord sleutel 6: <input id="form6" type="text" class="answerForm" maxlength="5" placeholder="_____" />
            <br>     
            Letters sleutel 7: <input id="form7" type="text" class="answerForm" maxlength="6" placeholder="______" />
            <br>                        
        </form>
        <i>Druk na het invoeren van de laatste sleutel op <code>Enter</code>!</i>
    </center>
</body>

</html>
