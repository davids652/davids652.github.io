<html>
    <head>
        <title>Fitt's Law</title>
        <style>
            body {
                background-color:#1e90ff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            #text {
                background-color: white;
                width: 50%;
                height: 30%;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                margin: auto;
            }
            #textContent {
                margin: auto;
                text-align: center;
                font-size: 50px;
            }
            .balk {
                width: 0%;
                height: 100%;
                background-color: white;
            }
            #balk2 {
                float: right;
            }
        </style>
    </head>

    <body>
        <div id="balk1" class="balk" onClick="clickOnBalk(1);"> </div>
        <div id="balk2" class="balk" onClick="clickOnBalk(2);"> </div>
        <div id="text"><div id="textContent">Test</div></div>
    </body>
</html>

<script>
let mode = 0; // 0 = before start; 1 = baseline; 2 = smaller; 3 = further away; 4 = small and far away; 5 = result
let balk1 = this.document.getElementById('balk1');
let balk2 = this.document.getElementById('balk2');
let text = this.document.getElementById('text');
let textContent = this.document.getElementById('textContent');
let times = [[],[],[],[],[]];
let appearTime = null;
let clicksLeft = 0;

balk1.style.display = 'none';
balk2.style.display = 'none';

textContent.innerHTML = "Fitts's Law test";
setTimeout(
    function() {
        textContent.innerHTML='3';
}, 1000);
setTimeout(
    function() {
        textContent.innerHTML='2';
}, 2000);
setTimeout(
    function() {
        textContent.innerHTML='1';
}, 3000);    
setTimeout(
    function() {
        textContent.innerHTML='0';
        text.style.display = 'none';
        switchToMode(1);
}, 4000);  

function switchToMode(modeNr){
    mode = modeNr;
    if(mode==1){
        balk1.style.width = '20%';
        balk2.style.width = '20%';
        balk1.style.marginLeft = '20%';
        balk2.style.marginRight = '20%';
        balk1.style.display = '';
        balk2.style.display = 'none';   
        clicksLeft = 5;
    } else if(mode==2){
        balk1.style.width = '8%';
        balk2.style.width = '8%';
        balk1.style.display = '';
        balk2.style.display = 'none';   
        balk1.style.marginLeft = '20%';
        balk2.style.marginRight = '20%';        
        clicksLeft = 5;
    } else if(mode==3){
        balk1.style.width = '20%';
        balk2.style.width = '20%';
        balk1.style.display = '';
        balk2.style.display = 'none';   
        balk1.style.marginLeft = '5%';
        balk2.style.marginRight = '5%';        
        clicksLeft = 5;
    } else if(mode==4){
        balk1.style.width = '8%';
        balk2.style.width = '8%';
        balk1.style.display = '';
        balk2.style.display = 'none';   
        balk1.style.marginLeft = '5%';
        balk2.style.marginRight = '5%';        
        clicksLeft = 5;
    } else if(mode==5){

        balk1.style.display = 'none';
        balk2.style.display = 'none';  

        textContent.innerHTML='<b>Basismeting:</b>' + gemiddelde(1) + 'miliseconds<br><b>Kleiner:</b>' + gemiddelde(2) + 'miliseconds<br><b>Meer afstand:</b>' + gemiddelde(3) + 'miliseconds<br><b>Beide:</b>' + gemiddelde(4) + 'miliseconds';
        text.style.display = '';

    }
    appearTime = Date.now();
}

function clickOnBalk(balkNr){
    let diff = Date.now() - appearTime;
    console.log(mode + "-"+clicksLeft);
    times[mode][clicksLeft] = diff;

    if(clicksLeft==0){
        if(mode==1){
            switchToMode(2);
        } else if (mode==2){
            switchToMode(3);
        } else if (mode==3){
            switchToMode(4);
        } else if (mode==4){
            switchToMode(5);
            return;
        }
    } else {
        clicksLeft--;
    }

    if(balkNr==1){
        balk1.style.display = 'none';
        balk2.style.display = '';   
    } else {
        balk1.style.display = '';
        balk2.style.display = 'none';   
    }
    appearTime = Date.now();
}

function gemiddelde(j){
    let totaal = 0;
    for(i = 0; i<5; i++){
        totaal = totaal + times[j][i];
    }
    return Math.floor(totaal/6);
}

</script>
