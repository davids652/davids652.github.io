<html>
    <head>
        <title>Formulier</title>
    </head>

    <body>
        <h1>Schrijf je nu in!</h1>
        <form method="POST">
            Gebruikersnaam: <input type="text" value="Kies een gebruikersnaam..."/>
            <br>
            Wachtwoord: <input type="password" value="Wachtwoord"/>
            <br>
            <input type="checkbox" id="conditions" name="conditions" checked />
            Ik accepteer de voorwaarden niet<br>
<br><br>
            <label for="vol">Beweeg de slider naar rechts om te versturen</label><br>
            <input type="range" id="vol" name="vol" min="0" max="100" onchange="checkSubmit();">
        </form>
    </body>
</html>

<script>
    function checkSubmit() {
        value = document.getElementById("vol").value;
        if(value==100){
            location.href = "form1_submit.html";
        }
    }
</script>
